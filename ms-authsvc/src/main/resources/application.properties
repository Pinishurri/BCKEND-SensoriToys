spring.application.name=authsvc
server.port=8090

spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Debe reemplazarse mediante JWT_SECRET en ambientes reales (minimo 32 caracteres).
jwt.secret=${JWT_SECRET:sensoritoys-clave-secreta-muy-segura-para-jwt-2026-xyz}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

authsvc.usuarios-url=${USERS_SERVICE_URL:http://localhost:8081}
