spring.application.name=ms-usuarios
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/usuarios_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

sensoritoys.jwt.secret=${JWT_SECRET:sensoritoys-clave-secreta-muy-segura-para-jwt-2026-xyz}
sensoritoys.datos-iniciales=true
sensoritoys.admin.email=admin@sensoritoys.cl
sensoritoys.admin.password=${ADMIN_PASSWORD:Admin2026!}
