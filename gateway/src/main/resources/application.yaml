server:
  port: 8089

spring:
  application:
    name: gateway-sensoritoys
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            - id: ms-usuarios
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/usuarios/**
            - id: ms-productos
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/productos/**
            - id: ms-categorias
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/categorias/**
            - id: ms-pedidos
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/pedidos/**

sensoritoys:
  cors:
    origen-permitido: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:sensoritoys-clave-secreta-muy-segura-para-jwt-2026-xyz}